<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gaston Scoreboard - Menu Utama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20.0.0" />
</head>
<body class="page-shell landing-page">
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo shuttle-mark"></div>
      <div>
        <h1>GASTON SCOREBOARD</h1>
        <p>Pilih lapangan dan tampilan</p>
      </div>
    </div>
  </header>

  <main class="landing-layout">
    <section class="panel selection-panel">
      <div class="section-title"><span>1</span> Choose Court / Lapangan</div>
      <div id="courtGrid" class="court-grid"></div>

      <div class="divider"></div>

      <div class="section-title"><span>2</span> Choose View</div>
      <div class="view-grid simple-view-grid">
        <button class="view-card simple-view-card selected" data-view="scoreboard">
          <div class="view-card-head simple-view-head">
            <div>
              <h2>Scoreboard</h2>
              <p>Tampilan layar publik untuk menampilkan skor pertandingan secara live.</p>
            </div>
            <span class="check">✓</span>
          </div>
        </button>

        <button class="view-card simple-view-card" data-view="admin">
          <div class="view-card-head simple-view-head">
            <div>
              <h2>Admin Panel</h2>
              <p>Panel kontrol untuk operator mengatur skor, server, game, dan data pertandingan.</p>
            </div>
            <span class="check">✓</span>
          </div>
        </button>
      </div>

      <div class="landing-buttons">
        <button id="openView" class="primary-btn">🚀 Open View</button>
        <button id="resetSelection" class="secondary-btn">↺ Reset Selection</button>
      </div>
    </section>
  </main>

  <footer class="footer-strip">
    <span>ⓘ Use this page to open the correct court display or admin control panel.</span>
    <span><i class="shuttle-icon tiny"></i> Thank you for supporting <b>GASTON SCOREBOARD</b></span>
  </footer>

  <script type="module" src="js/landing.js?v=20.0.0"></script>
</body>
</html>
